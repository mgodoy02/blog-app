<section class="blog-container">

  <h1>Blog de Noticias</h1>

  <div class="listado-noticias">
    @for (noticia of noticias; track noticia.titulo) {
      <article class="noticia">
        <img [src]="noticia.imagen" [alt]="noticia.titulo">
        <h2>{{ noticia.titulo }}</h2>
        <p class="fecha">{{ noticia.fecha }}</p>
        <p class="texto">{{ noticia.texto }}</p>
      </article>
    } @empty {
      <p>No hay noticias publicadas todavía.</p>
    }
  </div>

</section>

<section class="form-noticia">
  <h2>Publicar nueva noticia</h2>

  <div class="campo">
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" [(ngModel)]="nuevaNoticia.titulo" placeholder="Introduce el título">
  </div>

  <div class="campo">
    <label for="imagen">Imagen (URL):</label>
    <input type="text" id="imagen" [(ngModel)]="nuevaNoticia.imagen" placeholder="https://...">
  </div>

  <div class="campo">
    <label for="texto">Texto:</label>
    <textarea id="texto" [(ngModel)]="nuevaNoticia.texto" placeholder="Escribe el contenido de la noticia"></textarea>
  </div>

  <div class="campo">
    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha" [(ngModel)]="nuevaNoticia.fecha">
  </div>

  <button type="button">Publicar</button>
</section>
